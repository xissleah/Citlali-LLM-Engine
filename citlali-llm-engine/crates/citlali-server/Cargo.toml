[package]
name = "citlali-server"
version = "0.1.0"
edition = "2021"
description = "OpenAI 兼容 HTTP API 服务"

[[bin]]
name = "citlali-server"
path = "src/main.rs"

[dependencies]
citlali-model = { path = "../citlali-model" }
citlali-runtime = { path = "../citlali-runtime" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
