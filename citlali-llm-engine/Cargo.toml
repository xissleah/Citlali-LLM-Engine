[workspace]
members = [
    "crates/citlali-gguf",
    "crates/citlali-compute",
    "crates/citlali-model",
    "crates/citlali-runtime",
    "crates/citlali-cli",
    "crates/citlali-server",
]
resolver = "2"

[[example]]
name = "inspect_gguf"
path = "examples/inspect_gguf.rs"

[[example]]
name = "dequant_test"
path = "examples/dequant_test.rs"

[[example]]
name = "generate"
path = "examples/generate.rs"

[workspace.dependencies]
citlali-gguf = { path = "crates/citlali-gguf" }
citlali-compute = { path = "crates/citlali-compute" }
citlali-model = { path = "crates/citlali-model" }
citlali-runtime = { path = "crates/citlali-runtime" }
rayon = "1"

[dependencies]
citlali-gguf = { workspace = true }
citlali-compute = { workspace = true }
citlali-model = { workspace = true }
citlali-runtime = { workspace = true }

[package]
name = "citlali-llm-engine"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 2     # debug 模式下也开优化，推理速度接近 release

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
